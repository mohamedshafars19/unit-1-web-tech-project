<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chronograph</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;500;700&display=swap');

  :root {
    --bg: #0a0a0b;
    --panel: #131315;
    --panel-border: #232326;
    --lime: #c8ff00;
    --text: #e8e8e6;
    --text-dim: #6a6a6e;
    --red: #ff4d3d;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background-image:
      linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
    background-size: 32px 32px;
  }

  .device {
    width: 100%;
    max-width: 460px;
  }

  .eyebrow {
    font-family: 'Bebas Neue', sans-serif;
    letter-spacing: 0.35em;
    font-size: 13px;
    color: var(--text-dim);
    text-align: center;
    margin-bottom: 6px;
  }

  h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 34px;
    letter-spacing: 0.06em;
    text-align: center;
    color: var(--text);
    margin-bottom: 28px;
  }

  h1 span { color: var(--lime); }

  .face {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 20px;
    padding: 40px 28px 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .ring-wrap {
    position: relative;
    width: 260px;
    height: 260px;
    margin-bottom: 8px;
  }

  svg.ring {
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
  }

  .ring-track {
    fill: none;
    stroke: #232326;
    stroke-width: 3;
  }

  .ring-progress {
    fill: none;
    stroke: var(--lime);
    stroke-width: 3;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.05s linear;
  }

  .ring-progress.running {
    filter: drop-shadow(0 0 6px rgba(200,255,0,0.55));
  }

  .time-display {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }

  .time-main {
    font-size: 46px;
    font-weight: 700;
    letter-spacing: 0.01em;
    font-variant-numeric: tabular-nums;
  }

  .time-ms {
    font-size: 18px;
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
  }

  .status {
    font-family: 'Bebas Neue', sans-serif;
    letter-spacing: 0.25em;
    font-size: 12px;
    margin-top: 8px;
    color: var(--text-dim);
  }

  .status.running { color: var(--lime); }
  .status.stopped { color: var(--red); }

  .status-dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
    margin-right: 8px;
    vertical-align: middle;
  }

  .status.running .status-dot {
    animation: pulse 1.2s infinite ease-in-out;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.25; }
  }

  .controls {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    width: 100%;
    margin-top: 32px;
  }

  button {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 14px 10px;
    border-radius: 10px;
    border: 1px solid var(--panel-border);
    background: #1a1a1d;
    color: var(--text);
    cursor: pointer;
    transition: all 0.15s ease;
  }

  button:hover:not(:disabled) {
    border-color: #3a3a3e;
    background: #202023;
  }

  button:active:not(:disabled) {
    transform: scale(0.97);
  }

  button:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }

  button:focus-visible {
    outline: 2px solid var(--lime);
    outline-offset: 2px;
  }

  #startBtn {
    background: var(--lime);
    color: #0a0a0b;
    border-color: var(--lime);
    font-weight: 700;
  }

  #startBtn:hover:not(:disabled) {
    background: #d8ff33;
  }

  #startBtn.is-running {
    background: var(--red);
    color: #fff;
    border-color: var(--red);
  }

  #startBtn.is-running:hover:not(:disabled) {
    background: #ff6656;
  }

  .log-panel {
    margin-top: 20px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 20px;
    overflow: hidden;
  }

  .log-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 20px;
    border-bottom: 1px solid var(--panel-border);
  }

  .log-header span:first-child {
    font-family: 'Bebas Neue', sans-serif;
    letter-spacing: 0.2em;
    font-size: 13px;
    color: var(--text-dim);
  }

  .log-count {
    font-size: 12px;
    color: var(--text-dim);
  }

  .log-list {
    max-height: 220px;
    overflow-y: auto;
  }

  .log-list::-webkit-scrollbar {
    width: 6px;
  }

  .log-list::-webkit-scrollbar-thumb {
    background: #2a2a2e;
    border-radius: 3px;
  }

  .log-row {
    display: grid;
    grid-template-columns: 44px 1fr 1fr;
    gap: 8px;
    padding: 12px 20px;
    font-size: 13px;
    border-bottom: 1px solid #1c1c1f;
    animation: slideIn 0.2s ease;
  }

  .log-row:last-child { border-bottom: none; }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .log-row .idx {
    color: var(--text-dim);
  }

  .log-row .split {
    color: var(--text);
  }

  .log-row .total {
    color: var(--text-dim);
    text-align: right;
  }

  .log-row.fastest .split { color: var(--lime); }
  .log-row.slowest .split { color: var(--red); }

  .empty-log {
    padding: 28px 20px;
    text-align: center;
    color: var(--text-dim);
    font-size: 13px;
  }

  @media (max-width: 420px) {
    .ring-wrap { width: 220px; height: 220px; }
    .time-main { font-size: 38px; }
  }
</style>
</head>
<body>

<div class="device">
  <div class="eyebrow">PRECISION TIMING</div>
  <h1>CHRONO<span>GRAPH</span></h1>

  <div class="face">
    <div class="ring-wrap">
      <svg class="ring" viewBox="0 0 260 260">
        <circle class="ring-track" cx="130" cy="130" r="120"></circle>
        <circle id="ringProgress" class="ring-progress" cx="130" cy="130" r="120"></circle>
      </svg>
      <div class="time-display">
        <div class="time-main" id="timeMain">00:00:00</div>
        <div class="time-ms" id="timeMs">.00</div>
      </div>
    </div>

    <div class="status stopped" id="statusLabel">
      <span class="status-dot"></span>READY
    </div>

    <div class="controls">
      <button id="startBtn">Start</button>
      <button id="lapBtn" disabled>Lap</button>
      <button id="resetBtn" disabled>Reset</button>
    </div>
  </div>

  <div class="log-panel">
    <div class="log-header">
      <span>LAP LOG</span>
      <span class="log-count" id="logCount">0 laps</span>
    </div>
    <div class="log-list" id="logList">
      <div class="empty-log" id="emptyLog">No laps recorded yet</div>
    </div>
  </div>
</div>

<script>
  const startBtn = document.getElementById('startBtn');
  const lapBtn = document.getElementById('lapBtn');
  const resetBtn = document.getElementById('resetBtn');
  const timeMain = document.getElementById('timeMain');
  const timeMs = document.getElementById('timeMs');
  const statusLabel = document.getElementById('statusLabel');
  const logList = document.getElementById('logList');
  const logCount = document.getElementById('logCount');
  const emptyLog = document.getElementById('emptyLog');
  const ringProgress = document.getElementById('ringProgress');

  const RADIUS = 120;
  const CIRCUMFERENCE = 2 * Math.PI * RADIUS;
  ringProgress.style.strokeDasharray = CIRCUMFERENCE;
  ringProgress.style.strokeDashoffset = CIRCUMFERENCE;

  let running = false;
  let startTime = 0;
  let elapsed = 0;
  let rafId = null;
  let laps = [];

  function formatTime(ms) {
    const totalMs = Math.floor(ms);
    const hours = Math.floor(totalMs / 3600000);
    const minutes = Math.floor((totalMs % 3600000) / 60000);
    const seconds = Math.floor((totalMs % 60000) / 1000);
    const centis = Math.floor((totalMs % 1000) / 10);

    const pad = (n, len = 2) => String(n).padStart(len, '0');

    return {
      main: `${pad(hours)}:${pad(minutes)}:${pad(seconds)}`,
      ms: `.${pad(centis)}`
    };
  }

  function updateDisplay() {
    const now = running ? elapsed + (performance.now() - startTime) : elapsed;
    const { main, ms } = formatTime(now);
    timeMain.textContent = main;
    timeMs.textContent = ms;

    const secondsFraction = (now % 60000) / 60000;
    const offset = CIRCUMFERENCE - secondsFraction * CIRCUMFERENCE;
    ringProgress.style.strokeDashoffset = offset;
  }

  function tick() {
    updateDisplay();
    if (running) rafId = requestAnimationFrame(tick);
  }

  function start() {
    running = true;
    startTime = performance.now();
    startBtn.textContent = 'Stop';
    startBtn.classList.add('is-running');
    lapBtn.disabled = false;
    resetBtn.disabled = false;
    statusLabel.className = 'status running';
    statusLabel.innerHTML = '<span class="status-dot"></span>RUNNING';
    ringProgress.classList.add('running');
    rafId = requestAnimationFrame(tick);
  }

  function stop() {
    running = false;
    elapsed += performance.now() - startTime;
    startBtn.textContent = 'Start';
    startBtn.classList.remove('is-running');
    lapBtn.disabled = true;
    statusLabel.className = 'status stopped';
    statusLabel.innerHTML = '<span class="status-dot"></span>STOPPED';
    ringProgress.classList.remove('running');
    if (rafId) cancelAnimationFrame(rafId);
    updateDisplay();
  }

  function reset() {
    running = false;
    elapsed = 0;
    laps = [];
    if (rafId) cancelAnimationFrame(rafId);
    startBtn.textContent = 'Start';
    startBtn.classList.remove('is-running');
    lapBtn.disabled = true;
    resetBtn.disabled = true;
    statusLabel.className = 'status stopped';
    statusLabel.innerHTML = '<span class="status-dot"></span>READY';
    ringProgress.classList.remove('running');
    updateDisplay();
    renderLaps();
  }

  function recordLap() {
    const now = elapsed + (performance.now() - startTime);
    const prevTotal = laps.length > 0 ? laps[laps.length - 1].total : 0;
    const split = now - prevTotal;
    laps.push({ total: now, split });
    renderLaps();
  }

  function renderLaps() {
    logCount.textContent = `${laps.length} lap${laps.length === 1 ? '' : 's'}`;

    if (laps.length === 0) {
      logList.innerHTML = '';
      logList.appendChild(emptyLog);
      return;
    }

    const splits = laps.map(l => l.split);
    const fastest = Math.min(...splits);
    const slowest = Math.max(...splits);

    logList.innerHTML = '';
    for (let i = laps.length - 1; i >= 0; i--) {
      const lap = laps[i];
      const row = document.createElement('div');
      row.className = 'log-row';
      if (laps.length > 1) {
        if (lap.split === fastest) row.classList.add('fastest');
        else if (lap.split === slowest) row.classList.add('slowest');
      }
      const splitFmt = formatTime(lap.split);
      const totalFmt = formatTime(lap.total);
      row.innerHTML = `
        <span class="idx">#${i + 1}</span>
        <span class="split">${splitFmt.main}${splitFmt.ms}</span>
        <span class="total">${totalFmt.main}${totalFmt.ms}</span>
      `;
      logList.appendChild(row);
    }
  }

  startBtn.addEventListener('click', () => {
    if (running) stop();
    else start();
  });

  lapBtn.addEventListener('click', recordLap);
  resetBtn.addEventListener('click', reset);

  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
      e.preventDefault();
      startBtn.click();
    } else if (e.code === 'KeyL' && !lapBtn.disabled) {
      recordLap();
    } else if (e.code === 'KeyR' && !resetBtn.disabled) {
      reset();
    }
  });

  updateDisplay();
</script>

</body>
</html>
